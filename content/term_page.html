<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 터미널 · FIGTEAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #090d16; --surface: #0f172a; --surface-border: #1e293b; --surface-card: #141e33; --surface-hover: #1e2a47;
      --text-main: #f8fafc; --text-sub: #94a3b8; --text-muted: #64748b; --primary: #2563eb; --primary-hover: #1d4ed8;
      --blue: #38bdf8; --green: #10b981; --yellow: #f59e0b; --border-color: #334155; --font-mono: 'JetBrains Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .manual-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
/*TERM_CSS*/
  </style>
</head>
<body data-page="term">
  <!-- TOP HEADER (FHD FIXED) -->
  <header>
    <div class="header-left">
      <div class="brand-title">
        <span>FIGTEAM 하이브리드 멀티클라우드</span>
        <span class="brand-tag">v2.0 FHD</span>
      </div>
      <div class="header-clock-timer">
        <span id="current-clock">2026-11-26 00:00:00 KST</span>
        <span>·</span>
        <div class="pulse-dot"></div>
        <span id="timer-label">인프라 텔레메트리 연동</span>
      </div>
    </div>

    <!-- INDIVIDUAL INFRASTRUCTURE STATUS BADGES -->
    <div class="header-infra-status">
      <!-- 1. KT Edge -->
      <div class="infra-badge-item">
        <span class="infra-badge-name">KT Edge</span>
        <span class="infra-badge-state state-green" id="top-badge-kt-edge">정상</span>
      </div>
      <!-- 2. Onprem K8s cp1 -->
      <div class="infra-badge-item">
        <span class="infra-badge-name">온프렘 cp1</span>
        <span class="infra-badge-state state-green" id="top-badge-k8s-cp1">정상</span>
      </div>
      <!-- 3. Onprem DB db01 -->
      <div class="infra-badge-item">
        <span class="infra-badge-name">온프렘 db01</span>
        <span class="infra-badge-state state-green" id="top-badge-db-01">정상</span>
      </div>
      <!-- 4. AWS CTL -->
      <div class="infra-badge-item">
        <span class="infra-badge-name">AWS CTL</span>
        <span class="infra-badge-state state-green" id="top-badge-aws-ctl">정상</span>
      </div>
      <!-- 5. AWS DR (Standby is Normal) -->
      <div class="infra-badge-item">
        <span class="infra-badge-name">AWS DR</span>
        <span class="infra-badge-state state-amber" id="top-badge-aws-dr" title="AWS는 Standby 상태가 정상 가동입니다.">Standby(정상)</span>
      </div>
    </div>

    <!-- NAVIGATION & LOGOUT -->
    <div class="header-right">
      <div class="fs-ctl" role="group" aria-label="글자 크기" title="글자 크기 조절">
        <button type="button" class="fs-btn" onclick="figFont(-1)" aria-label="글자 작게">가−</button>
        <button type="button" class="fs-btn" onclick="figFont(0)" aria-label="글자 기본" title="기본으로">가</button>
        <button type="button" class="fs-btn" onclick="figFont(1)" aria-label="글자 크게">가+</button>
      </div>
      <button type="button" class="nav-btn" id="btn-tab-dashboard" onclick="location.href='/'">대시보드</button>
      <button type="button" class="nav-btn" id="btn-tab-settings" onclick="location.href='/#cfg/kt-edge'">설계/설정</button>
      <button type="button" class="nav-btn active" id="btn-tab-console" onclick="location.href='/term/'">콘솔</button>
      <a class="nav-btn" id="btn-tab-hub" href="/api/ai/hub" onclick="try{const p=JSON.parse(localStorage.getItem('fig.access.profile_v1')||'{}');const u=p.member||localStorage.getItem('fig.term.user')||'';const ak=p.access_key||'';let q=[];if(u)q.push('member='+encodeURIComponent(u));if(ak)q.push('access_key='+encodeURIComponent(ak));if(q.length)this.href='/api/ai/hub?'+q.join('&');}catch(e){}" style="text-decoration:none;" title="협업 허브">협업 허브</a>
      <div class="g-user-badge" id="portal-user-badge" style="display:none;">
        <span class="g-user-dot"></span>
        <span class="g-user-name" id="portal-user-name"></span>
        <span class="g-user-key" id="portal-user-key"></span>
      </div>
      <button type="button" class="logout-btn" id="logout-btn" onclick="csTermLogout()" style="display:none;">로그아웃</button>
    </div>
  </header>

  <noscript>통합 터미널은 자바스크립트가 필요합니다.</noscript>
  <script>
    function cfgEsc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function wikiToast(msg) {
      let t = document.getElementById('wk-toast');
      if (!t) { t = document.createElement('div'); t.id = 'wk-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
    }
    // 글자 크기 조절
    var FIG_FS = [0.85, 0.925, 1, 1.1, 1.25, 1.4], FIG_FS_BASE = 2;
    function figFont(dir) {
      var i;
      try { i = parseInt(localStorage.getItem('fig.fs'), 10); } catch (e) {}
      if (isNaN(i)) i = FIG_FS_BASE;
      if (dir === 1) i = Math.min(FIG_FS.length - 1, i + 1);
      else if (dir === -1) i = Math.max(0, i - 1);
      else if (dir === 0) i = FIG_FS_BASE;
      try { localStorage.setItem('fig.fs', i); } catch (e) {}
      var z = FIG_FS[i];
      var el = document.getElementById('cs-root'); if (el) el.style.zoom = z;
    }
    // 실시간 시계
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} KST`;
      const clockEl = document.getElementById('current-clock');
      if (clockEl) clockEl.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();
    // 사용자 배지 동기화
    function csTermSyncUserBadge() {
      try {
        const prof = JSON.parse(localStorage.getItem('fig.access.profile_v1') || 'null');
        const badge = document.getElementById('portal-user-badge');
        const nameEl = document.getElementById('portal-user-name');
        const keyEl = document.getElementById('portal-user-key');
        const logoutBtn = document.getElementById('logout-btn');
        if (prof && prof.member) {
          if (badge) badge.style.display = 'flex';
          if (nameEl) nameEl.textContent = prof.member;
          if (keyEl) keyEl.textContent = prof.access_key ? ('#' + prof.access_key.slice(-4)) : '';
          if (logoutBtn) logoutBtn.style.display = 'inline-block';
        }
      } catch (e) {}
    }
    function csTermLogout() {
      try {
        sessionStorage.clear();
        localStorage.removeItem('fig.access.profile_v1');
      } catch (e) {}
      location.href = '/';
    }
    window.addEventListener('DOMContentLoaded', () => {
      csTermSyncUserBadge();
      figFont();
    });
/*TERM_JS*/
  </script>
</body>
</html>
