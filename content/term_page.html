<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 터미널 · FIGTEAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #090d16; --surface: #0f172a; --surface-border: #1e293b; --surface-card: #141e33; --surface-hover: #1e2a47;
      --text-main: #f8fafc; --text-sub: #94a3b8; --text-muted: #64748b; --primary: #2563eb; --primary-hover: #1d4ed8;
      --blue: #38bdf8; --green: #10b981; --yellow: #f59e0b; --border-color: #334155; --font-mono: 'JetBrains Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .manual-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
/*TERM_CSS*/
  </style>
</head>
<body data-page="term">
  <noscript>통합 터미널은 자바스크립트가 필요합니다.</noscript>
  <script>
    function cfgEsc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function wikiToast(msg) {
      let t = document.getElementById('wk-toast');
      if (!t) { t = document.createElement('div'); t.id = 'wk-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
    }
/*TERM_JS*/
  </script>
</body>
</html>
