<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIGTEAM 하이브리드 멀티클라우드 관제 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-border: #1e293b;
      --surface-card: #141e33;
      --surface-hover: #1e2a47;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --blue: #38bdf8;
      --green: #10b981;
      --yellow: #f59e0b;
      --border-color: #334155;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* TOP HEADER BAR (FHD FIXED) */
    header {
      height: 52px;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .brand-tag {
      font-size: 10.5px;
      font-weight: 600;
      background: #1e293b;
      color: var(--blue);
      border: 1px solid #0284c7;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    .header-clock-timer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--text-sub);
      background: #090d16;
      border: 1px solid var(--surface-border);
      padding: 3px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 6px var(--blue);
    }

    /* TOP INFRASTATUS INDIVIDUAL BADGES */
    .header-infra-status {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      justify-content: center;
    }
    .infra-badge-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #141e33;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      white-space: nowrap;
    }
    .infra-badge-name {
      font-weight: 600;
      color: #cbd5e1;
    }
    .infra-badge-state {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .state-green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .state-amber {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    /* HEADER RIGHT NAV BUTTONS */
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-btn {
      background: #1e293b;
      border: 1px solid var(--surface-border);
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .nav-btn:hover {
      background: #334155;
      color: #fff;
    }
    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: #3b82f6;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .logout-btn:hover {
      background: #1f2937;
      color: #fff;
      border-color: #4b5563;
    }

    /* LOGIN VIEW */
    .login-wrapper {
      width: 100%;
      height: calc(100vh - 52px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
    }
    .login-input {
      width: 100%;
      height: 42px;
      background: #090d16;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 0 14px;
      font-size: 14px;
      color: #fff;
      margin-bottom: 14px;
    }
    .login-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .login-error {
      font-size: 12px;
      color: #ef4444;
      margin-bottom: 14px;
      text-align: center;
    }
    .login-submit-btn {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-submit-btn:hover {
      background: var(--primary-hover);
    }

    /* MAIN VIEW CONTAINERS */
    .view-container {
      width: 100%;
      height: calc(100vh - 52px);
      display: none;
      overflow: hidden;
    }

    /* ========================================================
       1. DASHBOARD VIEW (FHD FIXED)
       ======================================================== */
    .dashboard-layout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 12px;
      gap: 10px;
    }

    /* ROW 1: NODE RESOURCE MONITORING CARDS */
    .node-resource-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      flex-shrink: 0;
    }
    .node-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .node-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .node-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
    }
    .node-state-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
    }
    .node-meta {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .progress-bar-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }
    .progress-item {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-sub);
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: #090d16;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 1px;
    }
    .progress-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .fill-green { background: var(--green); }
    .fill-amber { background: var(--yellow); }

    /* DESKTOP ZERO-SCROLL MATRIX GRID */
    .desktop-dashboard-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 10px;
      gap: 8px;
      overflow: hidden;
    }
    .dashboard-toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 12px;
      flex-shrink: 0;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sort-tabs-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sort-btn {
      background: #141e33;
      border: 1px solid #1e293b;
      color: var(--text-sub);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .sort-btn:hover {
      background: #1e293b;
      color: #fff;
      border-color: #3b82f6;
    }
    .sort-btn.active {
      background: #1e293b;
      color: #38bdf8;
      border-color: #38bdf8;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }
    .matrix-5col-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .inst-grid-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      transition: border-color 0.15s ease;
    }
    .inst-grid-card:hover {
      border-color: #3b82f6;
    }
    .inst-grid-card-head {
      background: #141e33;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .inst-head-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .inst-card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
    }
    .inst-card-ip {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .inst-resource-hero {
      background: #090e1a;
      border-bottom: 1px solid #1e293b;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .hero-meter-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
    }
    .meter-label-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meter-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      line-height: 1.2;
    }
    .cpu-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .ram-badge {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .meter-val-used {
      font-size: 13px;
      font-weight: 800;
    }
    .cpu-used { color: #38bdf8; }
    .ram-used { color: #c084fc; }
    .meter-val-total {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .meter-pct {
      font-size: 11.5px;
      font-weight: 800;
      margin-left: 1px;
    }
    .cpu-pct { color: #38bdf8; }
    .ram-pct { color: #c084fc; }
    .meter-free-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-family: var(--font-mono);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 3px;
      padding: 1px 5px;
    }
    .free-k {
      color: #6ee7b7;
      font-size: 10px;
      font-weight: 600;
    }
    .free-v {
      color: #34d399;
      font-weight: 800;
      font-size: 11.5px;
    }
    .meter-gauge-track {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      display: flex;
      overflow: hidden;
    }
    .meter-gauge-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .cpu-fill { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    .ram-fill { background: linear-gradient(90deg, #7e22ce, #c084fc); }
    .hero-sub-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 3px;
      border-top: 1px dashed rgba(30, 41, 59, 0.8);
      font-family: var(--font-mono);
      font-size: 10.5px;
    }
    .hero-stat-pill {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stat-k { color: #94a3b8; }
    .stat-v { font-weight: 700; }
    .compact-service-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }
    .compact-service-row {
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      transition: all 0.12s ease;
      text-decoration: none;
    }
    .compact-service-row:hover {
      background: var(--surface-hover);
      border-color: var(--blue);
      transform: translateY(-1px);
    }
    .svc-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .svc-row-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .svc-row-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .svc-row-bot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      font-family: var(--font-mono);
      color: var(--text-sub);
    }
    .inst-card-footer {
      border-top: 1px solid var(--surface-border);
      padding: 6px 10px;
      background: #0d1424;
      flex-shrink: 0;
    }
    .open-modal-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #1e293b;
      color: var(--blue);
      padding: 4px 0;
      border-radius: 3px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s ease;
    }
    .open-modal-btn:hover {
      background: #1e293b;
      color: #fff;
      border-color: #3b82f6;
    }

    /* MODAL POPUP (BACKDROP & DIALOG) */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-dialog {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      width: 100%;
      max-width: 1100px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      overflow: hidden;
      animation: modalFadeIn 0.15s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      background: #141e33;
      border-bottom: 1px solid #1e293b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-title-text {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .modal-close-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .modal-close-btn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #dc2626;
    }
    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-summary-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .summary-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-k { font-size: 10px; color: var(--text-muted); }
    .summary-v { font-size: 12px; font-weight: 700; color: #fff; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .table-scroll {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--surface-border);
      border-radius: 4px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      text-align: left;
    }
    table.data-table th {
      background: #141e33;
      color: #94a3b8;
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 11px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #1e293b;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 11px;
      vertical-align: middle;
    }
    table.data-table tr:hover td {
      background: rgba(30, 42, 71, 0.45);
    }
    .rank-badge {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 2px 5px;
      border-radius: 3px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      text-align: center;
      display: inline-block;
    }
    .rank-top3 {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .cloud-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      white-space: nowrap;
    }
    .cloud-kt {
      background: rgba(2, 132, 199, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(2, 132, 199, 0.4);
    }
    .cloud-onprem {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .cloud-aws {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .inst-box {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .inst-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .inst-ip {
      font-size: 9.5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .type-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .type-web {
      background: rgba(99, 102, 241, 0.15);

  <!--CFG:BEGIN--><script type="application/json" id="cfg-data">{"measured":"2026-11-26","vars":[["S1_UPLINK","192.168.100.151 (wlp0s20f3, DHCP)","s1 인터넷 출구 · MASQUERADE 출구 장치","openstack-vm.sh 의 MAIN_DEV 자동 감지 → `sudo systemctl restart openstack-vmnet`"],["HOME_PUBLIC_IP","175.196.197.51 (집·강의장 회선, 바뀜)","KT 허브가 보는 s1 WG 출발지","s1이 keepalive 로 먼저 붙으므로 KT 쪽 수정 불필요. 핸드셰이크만 확인"],["S1_VMNET8_GW","192.168.120.2/24","ext-net 게이트웨이 · VM DNS(53→8.8.8.8 DNAT)","ext-subnet gateway_ip, openstack-vm.sh GW_IP_NEW"],["OS_CONTROLLER","192.168.120.160","Keystone·Nova·Neutron(OVN)·Horizon","s1 osx 래퍼, cloudflared horizon 라우트"],["OS_COMPUTE","161 compute1 · 163 compute3 · 164 compute4 (162 compute2 = down/삭제)","하이퍼바이저","`openstack hypervisor list`, ssh_known_hosts(마이그레이션)"],["RT_EDGE_EXT","192.168.120.202 (SNAT ON)","s1 → 172.20.0.0/24 정적 라우트 next-hop","datanet-route.conf 의 `ip route replace 172.20.0.0/24 via …`"],["RT_DATA_EXT","192.168.120.220 (SNAT OFF)","s1 → 10.10.2.0/24 정적 라우트 next-hop","datanet-route.conf 의 `ip route replace 10.10.2.0/24 via …`"],["FIP_CP1","192.168.120.226 → 172.20.0.86","VIP DNAT 대상 · cloudflared argocd/grafana · KT 6443 DNAT","openstack-vm.sh 34~38행, KT `iptables -t nat` 6443, cloudflared config"],["FIP_FREE","192.168.120.201 · .216 (미할당)","w1 등 추가 노드 외부 IP 후보","-"],["CP1 / W1 / DB","172.20.0.86 / 172.20.0.180 / 10.10.2.10","k3s 서버 / k3s 에이전트 / MySQL Primary","앱 env DB_HOST, sg-db, MySQL 계정 host"],["VIP_APP","10.10.1.100 (s1 lo) :80 → 192.168.120.226:30080","KT Edge upstream minwon_backend","KT `/etc/nginx/conf.d/upstream.conf`(switch_edge.yml 관리)"],["WG_NET","10.200.0.0/24 · .1 KT허브 · .2 s1 · .3 aws-ctl · .4 aws-dr · .5 kt-w1(예약)","3사 간 East-West","각 노드 wg 설정 AllowedIPs"],["KT_EDGE","공인 14.63.212.190 · 사설 172.27.0.160/16","인입·WAF·WG 허브","KT 콘솔 포트포워딩(TCP 22·80·443·30080 / UDP 51820)"],["AWS_DR","사설 10.51.1.165 · 공인 54.116.129.147 · t3.small","DR k3s + MySQL 복제본","KT 허브 peer Endpoint"],["AWS_CTL","사설 10.50.1.85 · 공인: 노션 13.125.163.58 / 허브 실측 13.124.253.30","Recovery Orchestrator :8080","공인 IP가 바뀐 흔적 → EIP·키페어 확인"],["K3S_VERSION","v1.37.2+k3s1 (온프렘·AWS 동일)","에이전트 조인 버전 고정","INSTALL_K3S_VERSION"],["POD / SVC CIDR","10.42.0.0/16 / 10.43.0.0/16 (k3s 기본)","flannel VXLAN · ClusterIP","다른 사이트 대역과 겹치면 안 됨"],["MTU","OVN 1442 · WG 1420 · cp1 flannel.1 1392","터널 중첩 단편화","`ip link`, `ping -M do -s`"],["APP NodePort","30080 (minwon-app-svc)","VIP DNAT · KT Edge","Service spec.ports.nodePort"]],"steps":[{"no":"S0","title":"접속 경로 확보","where":"맥","page":"inst-s1","area":"access","why":"모든 작업은 s1(10.10.10.8)을 거친다. OpenStack·k8s·db·AWS 노드에 공인 SSH 가 없다.","gate":"ssh user@10.10.10.8 hostname   # t1-vm2\nssh root@14.63.212.190 hostname # kt-edge-dr-01"},{"no":"S1","title":"s1 호스트 기반 (VMware·vmnet8·NAT)","where":"s1","page":"inst-s1","area":"vmnet","why":"OpenStack VM 4대가 vmnet8(192.168.120.0/24) 위에 있다. 게이트웨이 .2 와 MASQUERADE 가 없으면 VM 이 인터넷·DNS 를 못 쓴다.","gate":"ip -br a show vmnet8 | grep 192.168.120.2\nsysctl net.ipv4.ip_forward   # = 1"},{"no":"S2","title":"OpenStack 노드 기동·서비스 확인","where":"s1 → controller","page":"inst-controller","area":"svc","why":"nova-compute·OVN 에이전트가 up 이어야 서버 생성·FIP 가 동작한다.","gate":"~/bin/osx 160 \"source /root/keystonerc_admin; openstack compute service list\""},{"no":"S3","title":"OpenStack 네트워크·라우터·SG·Flavor·이미지","where":"controller","page":"inst-controller","area":"net","why":"라우터 외부 IP(.202/.220)가 정해져야 s1 정적 라우트를 걸 수 있다.","gate":"openstack router list\nopenstack router show rt-edge -c external_gateway_info"},{"no":"S4","title":"s1 정적 라우트·VIP DNAT","where":"s1","page":"inst-s1","area":"vmnet","why":"s1 이 172.20.0.0/24·10.10.2.0/24 로 가는 길을 알아야 WG 너머(KT·AWS)에서 온프렘에 닿는다.","gate":"ip r | grep -E '172.20.0.0|10.10.2.0'\ncurl -sI http://10.10.1.100/healthz"},{"no":"S5","title":"WireGuard 허브-스포크 (KT 허브 ↔ s1 ↔ AWS)","where":"KT·s1·AWS","page":"inst-ktedge","area":"wg","why":"KT 허브 10.200.0.1 이 모든 피어를 잇는다. 허브 AllowedIPs 에 온프렘 대역이 있어야 AWS·KT 가 온프렘으로 간다.","gate":"wg show   # 모든 peer latest handshake < 2분"},{"no":"S6","title":"VM 생성 (db-01 → k8s-cp1 + FIP → k8s-w1)","where":"controller","page":"inst-controller","area":"server","why":"DB 를 먼저 띄워야 앱 배포 시 DB_HOST 가 응답한다.","gate":"openstack server list --all-projects   # 3대 ACTIVE"},{"no":"S7","title":"db-01 MySQL 8.4 · 볼륨 · 백업","where":"db-01","page":"inst-db01","area":"mysql","why":"GTID·binlog 가 켜져 있어야 AWS 복제본이 붙는다.","gate":"sudo mysql -e \"select @@gtid_mode,@@read_only\"   # ON, 0"},{"no":"S8","title":"k3s 서버(cp1) → 에이전트(w1) → 앱·HPA·PDB·ArgoCD","where":"cp1·w1","page":"inst-cp1","area":"k3s","why":"metrics-server 가 있어야 HPA 가 동작하고, PDB 가 있어야 drain 때 서비스가 유지된다.","gate":"kubectl get nodes   # 2 Ready\nkubectl -n minwon-sample get hpa,pdb"},{"no":"S9","title":"KT Edge nginx·WAF upstream → VIP","where":"KT","page":"inst-ktedge","area":"nginx","why":"공개 진입(minwon.ktci5.kr)은 KT 하나. upstream 이 VIP 10.10.1.100 을 가리켜야 한다.","gate":"nginx -t && curl -s -o /dev/null -w '%{http_code}' -H 'Host: minwon.ktci5.kr' http://127.0.0.1/"},{"no":"S10","title":"AWS dr k3s · MySQL 복제 · 역터널 / ctl Orchestrator","where":"AWS","page":"inst-awsdr","area":"mysql","why":"평시 복제 지연 0 을 유지해야 L3 승격 시 RPO 가 0 에 가깝다.","gate":"Replica_IO_Running: Yes / Replica_SQL_Running: Yes / Seconds_Behind_Source: 0"},{"no":"S11","title":"Cloudflare Tunnel 라우트 (s1)","where":"s1","page":"inst-s1","area":"cfd","why":"figteam·horizon·kt-edge·aws-ctl 콘솔은 인바운드 포트 없이 터널로만 공개한다.","gate":"cloudflared tunnel ingress rule https://figteam.ktci5.kr --config /etc/cloudflared/config.yml"},{"no":"S12","title":"KT 워커 kt-w1 조인 (HA) → HPA 확장 → 버스팅","where":"KT·controller·cp1","page":"inst-ktw1","area":"pre","why":"S1~S11 이 모두 정상이어야 조인 단계에서 막히지 않는다. 제약 12개를 먼저 제거한다.","gate":"bash /root/kt-w1-preflight.sh   # 모든 항목 OK 일 때만 조인"}],"pages":{"overview":{"kind":"doc","title":"전체 구성과 변수표","tag":"실측 2026-11-26","desc":"온프렘(s1 노트북 위 VMware → OpenStack) · KT Cloud · AWS 를 WireGuard 허브(KT)로 묶은 구성이다. 아래 경로도와 변수표가 모든 페이지 명령어의 기준값이다.","blocks":[{"type":"h","text":"트래픽 경로 (실측)"},{"type":"code","label":"외부 요청 → 앱 → DB","code":"사용자\n  │ https://minwon.ktci5.kr  (Cloudflare 프록시)\n  ▼\nKT Edge kt-edge-dr-01  14.63.212.190 / 172.27.0.160\n  nginx :80/:443 → 127.0.0.1:8081 (ModSecurity WAF, 20r/s)\n  upstream minwon_backend = 10.10.1.100:80\n  │ WireGuard wg0 10.200.0.1  ──(UDP 51820)──▶  s1 wg-kt 10.200.0.2\n  ▼\ns1 (Ubuntu 26.04, t1-vm2)\n  lo 10.10.1.100  → iptables DNAT → 192.168.120.226:30080\n  │ vmnet8 192.168.120.0/24\n  ▼\nOpenStack rt-edge (FIP 192.168.120.226 ↔ 172.20.0.86)\n  ▼\nk8s-cp1 NodePort 30080 → Service minwon-app-svc → 파드 ×2 (현재 둘 다 k8s-w1)\n  │ DB_HOST=10.10.2.10  (172.20.0.0/24 → host route 10.10.2.0/24 via 172.20.0.125 = rt-data)\n  ▼\ndb-01 MySQL 8.4 Primary (GTID)  ──복제──▶ AWS dr minwon-mysql-0 (read_only=1)\n                                  (dr 의 port-forward 10.200.0.4:13306 역터널)"},{"type":"code","label":"관리 콘솔 (Cloudflare Tunnel, s1 에서 아웃바운드)","code":"figteam.ktci5.kr      → https://m07553287-create.github.io (GitHub Pages, 이 화면)\nfigteam-api.ktci5.kr  → 127.0.0.1:18088 (s1 figteam-portal)\nhorizon.ktci5.kr      → 192.168.120.160:80\nkt-edge.ktci5.kr      → 10.200.0.1:8088 (KT 상태 vhost, WG 전용)\naws-ctl.ktci5.kr      → 10.200.0.3:8080 (Recovery Orchestrator)\nargocd.ktci5.kr       → 192.168.120.226:30800  ※ 실측: argocd-server replicas 0, 30800 서비스 없음\ngrafana.ktci5.kr      → 192.168.120.226:30300  ※ 실측: 30300 서비스 없음"},{"type":"h","text":"공통 변수표"},{"type":"vars"},{"type":"h","text":"표시 규칙"},{"type":"legend"}]},"steps":{"kind":"doc","title":"선행 항목과 진행 순서","tag":"S0 → S12","desc":"각 단계의 '통과 조건'이 나와야 다음 단계로 간다. 통과 조건이 안 나오면 해당 인스턴스 페이지의 '오류 시 확인' 표로 간다.","blocks":[{"type":"steps"}]},"inst-s1":{"kind":"instance","cloud":"onprem","title":"s1 온프렘 호스트","tag":"t1-vm2 · 10.10.10.8","status":"live","steps":"S0 · S1 · S4 · S5 · S11","desc":"GPU 노트북의 Ubuntu. VMware Workstation 으로 OpenStack 노드 4대를 띄우고, vmnet8 게이트웨이·NAT·정적 라우트·WireGuard·Cloudflare Tunnel 을 맡는다. 온프렘의 모든 외부 연결이 이 호스트 하나를 지난다(단일 장애점).","specs":[["OS / 커널","Ubuntu 26.04.1 LTS / 7.0.0-44"],["CPU / RAM","20 vCPU / 30 GiB"],["디스크","/ 466G (사용 53%)"],["업링크","wlp0s20f3 192.168.100.151 (Wi-Fi, DHCP)"],["vmnet8","192.168.120.2/24 · 172.16.180.1/24"],["WG","wg-kt 10.200.0.2/24 · wg0 10.10.10.8/32"]],"areas":[{"id":"access","name":"접속 경로","status":"live","design":["맥 → s1 은 WG wg0(10.10.10.0/24, 집 공유기 51820)로 들어온다.","s1 → OpenStack 노드는 root 키 접속. `~/bin/osx <끝자리> \"<명령>\"` 래퍼로 통일한다.","AWS 노드는 공인 22 가 보안그룹(admin_cidrs)으로 막혀 있어 s1(WG 10.200.0.2) 경유만 된다."],"config":[{"label":"~/.ssh/config (맥)","code":"Host s1\n    HostName 10.10.10.8\n    User user\nHost cp1\n    HostName 192.168.120.226\n    User ubuntu\n    ProxyJump s1\nHost w1\n    HostName 172.20.0.180\n    User ubuntu\n    ProxyJump s1\nHost db-01\n    HostName 10.10.2.10\n    User ubuntu\n    ProxyJump s1\nHost dr\n    HostName 10.200.0.4\n    User rocky\n    IdentityFile ~/.ssh/minwon-key.pem\n    IdentitiesOnly yes\n    ProxyJump s1\nHost kt-edge\n    HostName 14.63.212.190\n    User root"},{"label":"s1 ~/bin/osx (OpenStack 노드 root 실행 래퍼)","code":"#!/bin/sh\n# osx <last-octet> \"<cmd>\"\nh=$1; shift\nexec ssh -n -q -o BatchMode=yes -o ConnectTimeout=8 \\\n  -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR root@192.168.120.$h \"$@\" "}],"commands":[{"cat":"조회","label":"노드별 접속 확인","code":"ssh s1 hostname                         # t1-vm2\nssh s1 '~/bin/osx 160 hostname'         # controller\nssh cp1 hostname; ssh w1 hostname; ssh db-01 hostname\nssh dr hostname                         # ip-10-51-1-165...\nssh kt-edge hostname                    # kt-edge-dr-01"}],"verify":[{"label":"전 구간 한 번에","code":"for h in s1 cp1 w1 db-01 dr kt-edge; do printf '%-8s ' $h; ssh -o ConnectTimeout=8 $h hostname 2>&1 | tail -1; done","expect":"6줄 모두 호스트명 출력"}],"trouble":[["ssh s1 타임아웃","맥 WG wg0 / 집 공인 IP","맥: `sudo wg show` 핸드셰이크 · s1: `sudo wg show wg0`","공유기 51820 포워딩, s1 Endpoint(175.196.197.51) 확인"],["cp1/w1 Permission denied","Nova keypair","controller: `openstack server show k8s-cp1 -c key_name`","cp1 은 figteam-key·s1-ktci5, w1 은 figteam-key(/root/figteam-key.pem on controller)만 붙어 있음 → cp1 경유 ProxyJump"],["aws-ctl Permission denied (실측)","ctl 키페어 / 공인 IP 변경","KT 허브 `wg show` 의 ctl Endpoint(13.124.253.30)와 노션 기록(13.125.163.58) 비교","ctl 재생성 여부·키페어 이름 확인 후 SSM Session Manager 로 접속(무-SSH 설계)"]]},{"id":"vmnet","name":"VMware·vmnet8·NAT·라우팅","status":"live","design":["VMware vmnet8(NAT) 위에 별칭 192.168.120.2/24 를 얹어 OpenStack ext-net(flat, physnet extnet) 게이트웨이로 쓴다.","VM 의 인터넷은 s1 MASQUERADE(-s 192.168.120.0/24 -o 업링크), DNS 는 192.168.120.2:53 → 8.8.8.8 DNAT.","OpenStack 내부망 2개는 라우터 외부 IP 로 정적 라우트: 172.20.0.0/24 → .202(rt-edge), 10.10.2.0/24 → .220(rt-data).","KT Edge 가 보는 앱 주소는 VIP 10.10.1.100(lo). PREROUTING/OUTPUT DNAT 로 cp1 FIP:30080 에 넘긴다.","맥(10.10.10.0/24)으로 가는 응답은 정책 라우팅 table 120 으로 공유기에 보낸다.","모두 `openstack-vm.service`(start)와 `openstack-vmnet.service`(net, 라우트 drop-in)가 부팅 때 다시 건다."],"config":[{"label":"/etc/systemd/system/openstack-vmnet.service.d/datanet-route.conf","code":"[Service]\n# OpenStack data-net(db-01) → rt-data ext IP\nExecStartPost=/usr/sbin/ip route replace 10.10.2.0/24 via 192.168.120.220 dev vmnet8\n# OpenStack figteam-net(k8s-cp1, k8s-w1) → rt-edge ext IP\nExecStartPost=/usr/sbin/ip route replace 172.20.0.0/24 via 192.168.120.202 dev vmnet8"},{"label":"~/bin/openstack-vm.sh net (핵심부)","code":"ip addr add 192.168.120.2/24 dev vmnet8                 # ext-net 게이트웨이\nip addr add 10.10.1.100/32 dev lo                        # KT Edge 용 VIP\niptables -t nat -A PREROUTING -d 10.10.1.100 -p tcp --dport 80 -j DNAT --to-destination 192.168.120.226:30080\niptables -t nat -A OUTPUT     -d 10.10.1.100 -p tcp --dport 80 -j DNAT --to-destination 192.168.120.226:30080\nip route replace 10.10.10.0/24 via 192.168.100.1 dev wlp0s20f3 table 120\nip rule add from 192.168.120.0/24 to 10.10.10.0/24 lookup 120 priority 1200\niptables -t nat -A POSTROUTING -s 192.168.120.0/24 -o $MAIN_DEV -j MASQUERADE\niptables -t nat -A PREROUTING -d 192.168.120.2 -p udp --dport 53 -j DNAT --to-destination 8.8.8.8:53"}],"commands":[{"cat":"적용","label":"네트워크 재적용 / VM 기동·정지","code":"sudo systemctl restart openstack-vmnet      # 별칭·NAT·라우트 재적용\n~/bin/openstack-vm.sh start                 # controller → compute1·3·4 순서 기동\n~/bin/openstack-vm.sh status                # VM·VIP 상태\n~/bin/openstack-vm.sh stop                  # soft → hard"},{"cat":"조회","label":"현재 상태","code":"vmrun list\nip -br a; ip r\nsudo iptables -t nat -S | grep -vE '^-N|KUBE|CNI|FLANNEL|DOCKER'\nip rule show | grep 1200\ngrep -E '^(memsize|numvcpus)' ~/vmware/*/*.vmx"}],"verify":[{"label":"VIP → 앱","code":"curl -sI http://10.10.1.100/healthz | head -1","expect":"HTTP/1.1 200"},{"label":"내부망 도달","code":"ping -c2 172.20.0.86; ping -c2 10.10.2.10","expect":"응답 (db-01 ICMP 는 sg-db 가 192.168.120.2 에 22/3306 만 허용 → ping 실패는 정상일 수 있음)"}],"trouble":[["VM 이 인터넷/apt 불가","S1_UPLINK (Wi-Fi 재연결로 장치·IP 변경)","`ip route show default` · `sudo iptables -t nat -S POSTROUTING`","`sudo systemctl restart openstack-vmnet` (MAIN_DEV 재감지)"],["KT/AWS → 172.20.x 불통","RT_EDGE_EXT / RT_DATA_EXT","`ip r | grep 172.20` · controller: `openstack router show rt-edge -c external_gateway_info`","라우터를 다시 만들어 외부 IP 가 바뀌었으면 datanet-route.conf 수정 → daemon-reload → restart"],["VIP 10.10.1.100 502/timeout","FIP_CP1 / NodePort","`curl -sI http://192.168.120.226:30080/healthz` · `kubectl -n minwon-sample get svc`","FIP 가 바뀌었으면 openstack-vm.sh 34~38행·KT 6443 DNAT·cloudflared 동시 수정"],["nat 규칙이 2벌씩 보임 (실측)","수동 실행 + 서비스 실행 중복","`sudo iptables -t nat -S | sort | uniq -d`","동작엔 영향 없음. 정리 시 `-D` 로 한 벌만 삭제(서비스 재시작 때 -C 검사로 다시 늘지 않음)"],["VM 기동 실패 / vmnet 권한","/dev/vmnet8 권한","`ls -l /dev/vmnet8`","drop-in 의 `chgrp user /dev/vmnet8 && chmod g+rw` 확인 → `sudo systemctl restart vmware`"]]},{"id":"wg","name":"WireGuard (wg-kt · wg0)","status":"live","design":["wg-kt: KT 허브 하나만 peer. AllowedIPs 10.200.0.0/24 + KT·AWS VPC(172.27/16, 10.50/16, 10.30/16) → 3사 대역이 전부 허브로 간다.","s1 은 NAT 뒤(집 회선)라 Endpoint 를 쓰지 않고 PersistentKeepalive 25 로 먼저 붙는다. 집 공인 IP 가 바뀌어도 허브가 따라온다.","wg0: 맥 관리용(10.10.10.0/24). 서비스 트래픽과 분리.","MTU 1420(기본). OVN 1442 위를 지나는 VXLAN 이 이 구간에서 단편화될 수 있다 → KT 워커 조인 시 C6 참고."],"config":[{"label":"/etc/wireguard/wg-kt.conf","code":"[Interface]\nAddress = 10.200.0.2/24\nPrivateKey = <s1 개인키 - 파일에만 둔다>\n\n[Peer]\n# KT Cloud Edge-GW Hub (kt-edge-dr-01)\nPublicKey = <KT 허브 공개키: KT 에서 `wg show wg0 public-key`>\nEndpoint = 14.63.212.190:51820\nAllowedIPs = 10.200.0.0/24, 10.30.0.0/16, 10.50.0.0/16, 172.27.0.0/16\nPersistentKeepalive = 25"}],"commands":[{"cat":"조회","label":"터널 상태","code":"sudo wg show wg-kt | grep -E 'endpoint|allowed|handshake|transfer'\nsystemctl is-enabled wg-quick@wg-kt wg-quick@wg0"},{"cat":"적용","label":"설정 변경 후 안전 재시작 (3분 자동 되돌리기)","code":"sudo cp /etc/wireguard/wg-kt.conf /root/wg-kt.conf.bak\n# 먼저 되돌리기 타이머를 건다 — 터널이 끊겨도 3분 뒤 원복\nsudo systemd-run --on-active=180 --unit=wg-rollback /bin/sh -c \\\n  'cp /root/wg-kt.conf.bak /etc/wireguard/wg-kt.conf && systemctl restart wg-quick@wg-kt'\nsudo systemctl restart wg-quick@wg-kt\nping -c3 10.200.0.1 && sudo systemctl stop wg-rollback.timer   # 정상이면 취소"}],"verify":[{"label":"허브·AWS 도달","code":"ping -c2 10.200.0.1; ping -c2 10.200.0.4","expect":"응답, handshake < 2분"}],"trouble":[["handshake 가 2분 이상 멈춤","KT 포트포워딩 UDP 51820 / 허브 peer 키","KT: `wg show wg0` 에서 s1 peer 의 endpoint·handshake","KT 콘솔 포트포워딩·방화벽, 허브 peer 공개키 일치 확인"],["`wg syncconf` 후 터널 멈춤","운영 금지 명령","`journalctl -u wg-quick@wg-kt -n 50`","syncconf 대신 위 '안전 재시작' 절차만 쓴다 (11-19 ctl 20분 단절 사례)"],["특정 대역만 불통","AllowedIPs 누락/중복","`ip r | grep wg-kt` · 허브 쪽 AllowedIPs","대역은 한 peer 에만. 허브 s1-peer 에 온프렘 대역 3개(192.168.120/24·172.20.0/24·10.10.2/24)가 있어야 함"]]},{"id":"cfd","name":"Cloudflare Tunnel","status":"live","design":["인바운드 포트 없이 s1 의 cloudflared 가 Cloudflare 로 아웃바운드 연결. 공개 진입(minwon)은 KT 하나만 둔다(앱 직통 openstack/app 호스트는 11-18 제거).","figteam.ktci5.kr 은 GitHub Pages 를 오리진으로 프록시(httpHostHeader 고정)."],"config":[{"label":"/etc/cloudflared/config.yml (ingress 부분)","code":"tunnel: <터널 UUID>\ningress:\n  - hostname: figteam-api.ktci5.kr\n    service: http://127.0.0.1:18088\n  - hostname: figteam.ktci5.kr\n    service: https://m07553287-create.github.io\n    originRequest:\n      httpHostHeader: figteam.ktci5.kr\n  - hostname: argocd.ktci5.kr\n    service: http://192.168.120.226:30800\n  - hostname: grafana.ktci5.kr\n    service: http://192.168.120.226:30300\n  - hostname: horizon.ktci5.kr\n    service: http://192.168.120.160:80\n  - hostname: kt-edge.ktci5.kr\n    service: http://10.200.0.1:8088\n  - hostname: aws-ctl.ktci5.kr\n    service: http://10.200.0.3:8080\n  - service: http_status:404"}],"commands":[{"cat":"조회","label":"라우트 검사","code":"sudo cloudflared tunnel ingress validate --config /etc/cloudflared/config.yml\nsudo cloudflared tunnel ingress rule https://aws-ctl.ktci5.kr --config /etc/cloudflared/config.yml\nsystemctl status cloudflared --no-pager | head -5"},{"cat":"적용","label":"변경 반영","code":"sudo systemctl restart cloudflared"}],"verify":[{"label":"오리진 응답","code":"curl -s -o /dev/null -w '%{http_code}\\n' http://10.200.0.1:8088/\ncurl -s http://10.200.0.3:8080/healthz","expect":"200 / Orchestrator 응답"}],"trouble":[["argocd/grafana 502 (실측)","백엔드 없음","cp1: `kubectl -n argocd get deploy argocd-server` (0/0) · `kubectl get svc -A | grep -E '30800|30300'`","argocd-server 를 1로 올리고 NodePort 30800 서비스 생성, 또는 라우트 삭제"],["figteam.ktci5.kr 옛 화면","Cloudflare·Pages 캐시(max-age=600)","`curl -sI https://figteam.ktci5.kr | grep -E 'age|last-modified'`","Actions 배포 완료 확인 후 10분 대기 또는 Cloudflare 캐시 퍼지"],["DNS 레코드가 엉뚱한 존에 생김","cert.pem 존 = ktci5.kr","`cloudflared tunnel route dns` 사용 존 확인","ktci5.kr 외 존은 API 토큰으로 DNS 수정"]]}]},"inst-controller":{"kind":"instance","cloud":"openstack","title":"OpenStack controller (+compute)","tag":"192.168.120.160","status":"live","steps":"S2 · S3 · S6","desc":"Packstack/RDO 단일 컨트롤러. Neutron 은 OVN. 인스턴스는 올리지 않고 compute1·3·4 에 배치한다. admin rc 로 전체를, figteam rc 로 프로젝트 자원을 다룬다.","specs":[["OS","CentOS Stream 9"],["VM 크기","4 vCPU / 10 GB (s1 VMware)"],["CLI g0.conf","code":"[Interface]\nAddress = 10.200.0.1/24\nListenPort = 51820\nPrivateKey = <허브 개인키>\n\n[Peer]   # 온프렘 s1\nPublicKey = <s1 공개키>\nAllowedIPs = 10.200.0.2/32, 192.168.120.0/24, 172.20.0.0/24, 10.10.1.0/24, 10.10.2.0/24\n\n[Peer]   # AWS ctl\nPublicKey = <ctl 공개키>\nAllowedIPs = 10.200.0.3/32\n\n[Peer]   # AWS dr\nPublicKey = <dr 공개키>\nAllowedIPs = 10.200.0.4/32\nEndpoint = 54.116.129.147:51820\n\n[Peer]   # KT 워커 kt-w1 (새 키로 교체 예정)\nPublicKey = <kt-w1 공개키>\nAllowedIPs = 10.200.0.5/32"}],"commands":[{"cat":"조회","label":"피어·경로","code":"wg show wg0 | grep -E 'peer|endpoint|allowed|handshake'\nip r | grep wg0\nsysctl net.ipv4.ip_forward"},{"cat":"적용","label":"피어 추가·교체 (런타임 → 파일)","code":"wg set wg0 peer <kt-w1 공개키> allowed-ips 10.200.0.5/32\nwg set wg0 peer <옛 공개키> remove\nwg-quick save wg0          # 런타임 상태를 wg0.conf 에 저장\n# syncconf 금지. 전체 재시작이 필요하면 s1 페이지의 '안전 재시작' 절차를 쓴다"}],"verify":[{"label":"온프렘·AWS 도달","code":"ping -c3 172.20.0.86; ping -c3 10.200.0.4","expect":"실측 RTT: 온프렘 avg 29ms(9~66, Wi-Fi 지터) · AWS 5ms"}],"trouble":[["peer 핸드셰이크 없음","피어 공개키 / 상대 Endpoint","`wg show wg0 latest-handshakes`","NAT 뒤 피어는 상대가 keepalive 로 먼저 붙어야 함"],["허브는 되는데 온프렘만 불통","s1 peer AllowedIPs","`ip r get 172.20.0.86`","온프렘 대역이 s1 peer 에만 있는지 확인"]]},{"id":"nginx","name":"nginx Edge·WAF","status":"live","design":["edge-http/https(:80/:443, server_name minwon.ktci5.kr origin-kt.ktci5.kr) → 127.0.0.1:8081(minwon.conf, ModSecurity on) → upstream minwon_backend.","레이트리밋 edge_per_ip 20r/s burst 40, 초과 429.","upstream.conf 는 Ansible switch_edge.yml 이 모드(onprem/aws)에 따라 다시 쓴다 → 손으로 고치면 다음 전환 때 사라진다. 템플릿을 고친다.","edge-status :8088 은 WG 전용 상태 화면(kt-edge.ktci5.kr)."],"config":[{"label":"/etc/nginx/conf.d/upstream.conf (현재 · mode onprem)","code":"# Managed by Ansible Recovery (switch_edge.yml)\nupstream minwon_backend {\n    server 10.10.1.100:80 max_fails=3 fail_timeout=10s;\n    keepalive 32;\n}"},{"label":"KT 워커 추가안 (설계 · switch_edge.yml 템플릿에 반영)","code":"upstream minwon_backend {\n    server 10.10.1.100:80  max_fails=3 fail_timeout=10s;   # 온프렘 VIP\n    server 10.200.0.5:30081 max_fails=3 fail_timeout=10s;  # kt-w1 전용 NodePort (Local)\n    keepalive 32;\n}"}],"commands":[{"cat":"조회","label":"설정·로그","code":"nginx -T 2>/dev/null | grep -E 'listen|server_name|proxy_pass|upstream|server ' | head -30\ntail -f /var/log/nginx/access.log"},{"cat":"적용","label":"반영","code":"nginx -t && systemctl reload nginx"}],"verify":[{"label":"엣지 → 백엔드","code":"curl -s -o /dev/null -w '%{http_code}\\n' -H 'Host: minwon.ktci5.kr' http://127.0.0.1/\ncurl -sI http://10.10.1.100/healthz | head -1","expect":"200 / 200"}],"trouble":[["502 Bad Gateway","upstream 대상","`curl -sI http://10.10.1.100/healthz`","s1 VIP DNAT·NodePort 순서로 점검"],["정상 요청 403","ModSecurity 룰","`grep -i modsec /var/log/nginx/error.log | tail`","/opt/waf-staging 룰 예외 처리"],["upstream 수정이 사라짐","switch_edge.yml","파일 첫 줄 'Managed by Ansible'","Ansible 템플릿 수정"]]},{"id":"nat","name":"iptables (6443 DNAT)","status":"live","design":["PREROUTING tcp 6443 → 192.168.120.226:6443 DNAT + MASQUERADE 가 걸려 있다(옛 KT 워커 조인용).","인터페이스 조건(-i wg0)이 없어 KT 포트포워딩에 6443 이 추가되면 바로 공개된다. 현재 포워딩 목록에는 없음.","새 설계는 kt-w1 이 172.20.0.86:6443 으로 직접 조인 → 이 DNAT 는 필요 없다. 정리 대상."],"config":[],"commands":[{"cat":"조회","label":"NAT 규칙","code":"iptables -t nat -S | grep -E '6443|DNAT|MASQ'"},{"cat":"적용","label":"정리 (설계 · 확인 후)","code":"iptables -t nat -D PREROUTING -p tcp --dport 6443 -j DNAT --to-destination 192.168.120.226:6443\niptables -t nat -D POSTROUTING -d 192.168.120.226/32 -p tcp --dport 6443 -j MASQUERADE"}],"verify":[],"trouble":[["외부에서 6443 응답","KT 포트포워딩 + 조건 없는 DNAT","KT 콘솔 포트포워딩 목록","DNAT 삭제 또는 `-i wg0` 조건 추가"]]}]},"inst-ktw1":{"kind":"instance","cloud":"kt","title":"kt-w1 (KT 워커 조인 · 설계)","tag":"WG 10.200.0.5","status":"design","steps":"S12 (S1~S11 통과 후)","desc":"KT Cloud VM 을 온프렘 k3s 에 워커로 붙인다. 아래 탭 순서대로 진행하면 조인 단계에서 막히지 않도록 실측으로 찾은 제약(C1~C12)을 먼저 없앤다. 전 과정은 '설계'이며 적용 전 영향 범위를 확인한다.","specs":[["권장 OS","Ubuntu 22.04 (cgroup v2)"],["권장 크기","2 vCPU / 4 GB"],["연결","개별 WG peer → KT 허브"],["node-ip","10.200.0.5 (flannel-iface wg0)"],["라벨/taint","zone=ktcloud · site=ktcloud:NoSchedule"],["k3s","v1.37.2+k3s1 agent"]],"areas":[{"id":"pre","name":"① 사전 점검","status":"design","design":["왜 개별 WG peer 인가: KT 사설망(172.27/16)으로 허브에 붙여 라우팅하면 KT SDN 의 출발지 검사에 막힐 수 있다. WG 로 감싸면 KT 망은 UDP 51820 만 본다.","옛 KT 워커(k8s-w2) 흔적: 허브의 10.200.0.5 peer 키, KT 허브 6443 DNAT. 새 키로 교체하고 DNAT 는 쓰지 않는다."],"config":[{"label":"/root/kt-w1-preflight.sh (kt-w1 에서 실행)","code":"#!/bin/bash\nok(){ echo \"OK   $1\"; }; ng(){ echo \"FAIL $1\"; FAIL=1; }\nFAIL=0\n[ \"$(stat -fc %T /sys/fs/cgroup)\" = cgroup2fs ] && ok \"cgroup v2\" || ng \"cgroup v1 (kubelet-arg fail-cgroupv1=false 필요)\"\nswapon --show | grep -q . && ng \"swap on\" || ok \"swap off\"\n[ \"$(hostname)\" != k8s-w1 ] && [ \"$(hostname)\" != k8s-cp1 ] && ok \"hostname $(hostname)\" || ng \"hostname 중복\"\ntimedatectl show -p NTPSynchronized --value | grep -q yes && ok \"NTP\" || ng \"NTP 미동기\"\nip -4 a show wg0 | grep -q 10.200.0.5 && ok \"wg0 10.200.0.5\" || ng \"wg0 없음\"\nfor t in 172.20.0.86:6443 172.20.0.180:30080 10.10.2.10:3306; do\n  timeout 3 bash -c \"<\/dev/tcp/${t%:*}/${t#*:}\" 2>/dev/null && ok \"tcp $t\" || ng \"tcp $t\"; done\nping -c2 -W2 -M do -s 1342 172.20.0.86 >/dev/null && ok \"MTU 1370 경로\" || ng \"MTU 1370 경로\"\ncurl -sk -m5 https://172.20.0.86:6443/ping | grep -q pong && ok \"API /ping\" || ng \"API /ping\"\ncurl -s -m5 -o /dev/null https://ghcr.io && ok \"인터넷(ghcr)\" || ng \"인터넷(ghcr)\"\nexit $FAIL"}],"commands":[{"cat":"검증","label":"실행","code":"sudo bash /root/kt-w1-preflight.sh"}],"verify":[{"label":"모든 항목 OK","code":"sudo bash /root/kt-w1-preflight.sh; echo exit=$?","expect":"exit=0 일 때만 ④ 조인"}],"trouble":[["tcp 10.10.2.10:3306 FAIL","sg-db · MySQL 계정","controller sg-db 규칙","② 의 C3 적용"],["MTU FAIL","터널 중첩","`ping -M do -s <크기>` 로 최대값 찾기","C6"]]},{"id":"wg","name":"② WG·OpenStack 개방","status":"design","design":["kt-w1 wg0: 허브 하나만 peer, AllowedIPs 에 온프렘 3대역 + WG 대역. 허브는 10.200.0.5/32 를 이미 갖고 있어 키만 바꾸면 된다.","s1 wg-kt AllowedIPs 10.200.0.0/24 에 .5 가 포함 → s1 수정 불필요.","OpenStack: sg-figteam-ha 에 8472/udp·10250/tcp, sg-db 에 3306 (출발지 10.200.0.5).","kt-w1 자체 방화벽: VXLAN·kubelet 은 192.168.120.226(cp1 FIP NAT)·192.168.120.202(w1 SNAT)·172.20.0.0/24 에서 들어온다."],"config":[{"label":"kt-w1 /etc/wireguard/wg0.conf","code":"[Interface]\nAddress = 10.200.0.5/24\nPrivateKey = <kt-w1 개인키: wg genkey 로 이 VM 에서만 생성>\n\n[Peer]   # KT 허브\nPublicKey = <허브 공개키>\nEndpoint = 172.27.0.160:51820        # 같은 KT 망이면 사설, 다른 존이면 14.63.212.190\nAllowedIPs = 10.200.0.0/24, 172.20.0.0/24, 192.168.120.0/24, 10.10.2.0/24, 10.10.1.0/24\nPersistentKeepalive = 25"},{"label":"kt-w1 방화벽 (ufw 예시)","code":"ufw allow in on wg0 from 192.168.120.0/24\nufw allow in on wg0 from 172.20.0.0/24\nufw allow in on wg0 from 10.200.0.0/24\nufw allow 22/tcp"}],"commands":[{"cat":"설치","label":"kt-w1 WG 기동","code":"sudo apt-get install -y wireguard\nwg genkey | sudo tee /etc/wireguard/kt-w1.key | wg pubkey     # 공개키만 허브에 전달\nsudo chmod 600 /etc/wireguard/kt-w1.key\nsudo systemctl enable --now wg-quick@wg0"},{"cat":"적용","label":"허브 키 교체 (KT 허브에서)","code":"wg set wg0 peer <옛 k8s-w2 공개키> remove\nwg set wg0 peer <kt-w1 공개키> allowed-ips 10.200.0.5/32\nwg-quick save wg0"},{"cat":"적용","label":"OpenStack 규칙 (controller)","code":"source /root/keystonerc_figteam\nopenstack security group rule create sg-figteam-ha --ingress --protocol udp --dst-port 8472  --remote-ip 10.200.0.0/24\nopenstack security group rule create sg-figteam-ha --ingress --protocol tcp --dst-port 10250 --remote-ip 10.200.0.0/24\nopenstack security group rule create sg-db        --ingress --protocol tcp --dst-port 3306  --remote-ip 10.200.0.5/32"}],"verify":[{"label":"양방향","code":"# kt-w1: ping -c2 172.20.0.86 ; ping -c2 172.20.0.180\n# cp1  : ping -c2 10.200.0.5","expect":"양쪽 응답"}],"trouble":[["cp1 → 10.200.0.5 불통","허브 peer / kt-w1 AllowedIPs 에 192.168.120.0/24 누락","kt-w1: `tcpdump -ni wg0 icmp`","cp1 패킷은 192.168.120.226 출발지로 온다 → AllowedIPs 에 포함"]]},{"id":"join","name":"③ k3s 에이전트 조인","status":"design","design":["K3S_URL 은 SAN 에 있는 https://172.20.0.86:6443 만 쓴다.","--node-ip / --flannel-iface 를 WG 로 고정: 지정하지 않으면 eth0(172.27.x)를 광고해 온프렘이 VXLAN 을 보낼 곳이 없다 → 파드는 Running 인데 DNS·서비스가 안 됨.","처음에는 taint 로 막아 두고(site=ktcloud:NoSchedule) 검증 후 앱만 toleration 으로 올린다."],"config":[{"label":"/etc/rancher/k3s/config.yaml (kt-w1)","code":"node-ip: 10.200.0.5\nflannel-iface: wg0\nnode-label:\n  - topology.kubernetes.io/zone=ktcloud\n  - site=ktcloud\nnode-taint:\n  - site=ktcloud:NoSchedule\n# Rocky 8 등 cgroup v1 이미지일 때만:\n# kubelet-arg:\n#   - \"fail-cgroupv1=false\" "}],"commands":[{"cat":"설치","label":"조인 (토큰은 파이프로만)","code":"# 맥에서 한 줄 — 토큰이 화면·파일에 남지 않는다\nTOKEN=\"$(ssh cp1 sudo cat /var/lib/rancher/k3s/server/node-token)\"\nssh kt-w1 \"curl -sfL https://get.k3s.io | sudo INSTALL_K3S_VERSION=v1.37.2+k3s1 \\\n  K3S_URL=https://172.20.0.86:6443 K3S_TOKEN='$TOKEN' sh -s - agent\"\nunset TOKEN"},{"cat":"조회","label":"조인 확인 (cp1)","code":"sudo kubectl get nodes -o wide\nsudo kubectl get node kt-w1 -o jsonpath='{.metadata.annotations.flannel\\.alpha\\.coreos\\.com/public-ip}'"},{"cat":"적용","label":"롤백","code":"sudo kubectl drain kt-w1 --ignore-daemonsets --delete-emptydir-data\nsudo kubectl delete node kt-w1\nssh kt-w1 sudo /usr/local/bin/k3s-agent-uninstall.sh"}],"verify":[{"label":"파드 네트워크","code":"sudo kubectl run net-kt --rm -it --image=busybox:1.36 --restart=Never \\\n  --overrides='{\"spec\":{\"nodeName\":\"kt-w1\",\"tolerations\":[{\"operator\":\"Exists\"}]}}' -- \\\n  sh -c 'nslookup minwon-app-svc.minwon-sample && wget -qO- http://minwon-app-svc.minwon-sample/healthz'","expect":"DNS 응답 + healthz"}],"trouble":[["x509 certificate is valid for 172.20.0.86","K3S_URL","조인 명령의 주소","172.20.0.86 으로 다시"],["Node password rejected","같은 이름 재조인","`kubectl -n kube-system get secret kt-w1.node-password.k3s`","노드·Secret 삭제 후 재조인"],["NotReady + cgroup 오류","cgroup v1 OS","`journalctl -u k3s-agent | grep -i cgroup`","kubelet-arg fail-cgroupv1=false 또는 Ubuntu 22.04"],["Ready 인데 파드 DNS 실패","VTEP=172.27.x / UDP 8472","위 public-ip 주석 값","node-ip·flannel-iface=wg0, sg 8472"]]},{"id":"ha","name":"④ 배치 (HA)","status":"design","design":["앱 Deployment 에 toleration + zone 분산(topologySpreadConstraints)을 넣어 온프렘 1 · KT 1 로 나눈다. ArgoCD 가 관리하므로 Git 매니페스트에 넣는다.","KT Edge 가 kt-w1 파드로 바로 보내도록 전용 Service(NodePort 30081, externalTrafficPolicy: Local)를 따로 만든다.","기존 minwon-app-svc 는 Cluster 그대로 둔다 — Local 로 바꾸면 파드가 없는 cp1:30080(VIP 경로)이 끊긴다(실측상 파드가 모두 w1).","KT 파드의 DB 질의는 WG 왕복(실측 avg 29~56ms)을 탄다 → 질의 수 많은 화면은 지연이 커진다. 읽기 위주부터 분산."],"config":[{"label":"minwon-app-kt Service (설계)","code":"apiVersion: v1\nkind: Service\nmetadata: {name: minwon-app-kt, namespace: minwon-sample}\nspec:\n  type: NodePort\n  externalTrafficPolicy: Local      # kt-w1 에 있는 파드만 응답\n  selector: {app: minwon-app}\n  ports:\n    - port: 80\n      targetPort: 8080              # 컨테이너 포트는 minwon-app-svc 의 targetPort 와 맞춘다\n      nodePort: 30081"}],"commands":[{"cat":"조회","label":"targetPort 확인","code":"sudo kubectl -n minwon-sample get svc minwon-app-svc -o jsonpath='{.spec.ports[0].targetPort}'"},{"cat":"검증","label":"KT 경로","code":"# KT 허브에서\ncurl -sI http://10.200.0.5:30081/healthz | head -1"}],"verify":[{"label":"사이트 분산","code":"sudo kubectl -n minwon-sample get pods -o wide","expect":"kt-w1 1개 + 온프렘 1개"}],"trouble":[["KT 파드만 DB 오류","C3 (계정·sg-db)","파드 로그","db-01 계정 minwon@10.200.0.5 + sg-db"],["30081 응답 없음","Local 정책 + 파드 없음","`kubectl get pods -o wide`","kt-w1 에 파드가 떠야 응답"]]},{"id":"hpa","name":"⑤ HPA·버스팅","status":"design","design":["HPA(2~4)는 그대로 쓰고, 분산 규칙 덕분에 늘어난 파드가 KT 쪽에도 놓인다. metrics-server → kt-w1:10250 이 열려 있어야 계산된다.","노드 단위 확장(버스팅): KT Cloud 는 Cluster Autoscaler 를 지원하지 않는다 → Pending 2분 지속 시 ktcloud-api 로 VM 생성 + cloud-init 조인 스크립트, 부하 해소 시 drain·삭제.","컨트롤 플레인 HA 는 하지 않는다(2사이트 정족수 문제). 대신 cp1 장애 시 기존 파드·Edge 경로는 유지되고 AWS DR 이 최종 대비."],"config":[{"label":"버스팅 판정 (설계 · cp1 cron)","code":"PENDING=$(kubectl -n minwon-sample get pods --field-selector=status.phase=Pending \\\n  -o jsonpath='{range .items[*]}{.metadata.creationTimestamp}{\"\\n\"}{end}' | wc -l)\n[ \"$PENDING\" -gt 0 ] && echo \"버스팅 필요: KT VM 생성 → cloud-init 으로 ③ 조인\"\n# 생성은 맥 ktcloud-api: python3 ktc.py d POST server/servers --json kt-wN.json --apply"}],"commands":[{"cat":"검증","label":"스케일 아웃 시험","code":"watch sudo kubectl -n minwon-sample get hpa,pods -o wide"}],"verify":[{"label":"부하 시 4개까지","code":"sudo kubectl -n minwon-sample get hpa","expect":"REPLICAS 2→4, KT 노드에 배치"}],"trouble":[["ktc.py 401 (실측)","키체인 API 키 만료","`python3 ktc.py secret --help`","KT 콘솔에서 키 재발급 후 키체인 저장"]]}]},"inst-awsdr":{"kind":"instance","cloud":"aws","title":"aws-dr (Pilot-Light)","tag":"10.200.0.4 · 10.51.1.165","status":"live","steps":"S5 · S10","desc":"평시 읽기 전용 대기. 단일 노드 k3s 에 앱 1개와 MySQL 복제본(StatefulSet)을 둔다. L3 승격 시 read_only 를 끄고 KT Edge 가 이쪽으로 전환한다.","specs":[["EC2","t3.small · Rocky 8.10 · 30GB"],["RAM","1.7 GiB (+swap 2G)"],["VPC","10.51.0.0/16 · 공인 54.116.129.147"],["k3s","v1.37.2+k3s1 (cgroup v1)"],["MySQL","8.4.13 · server_id 2 · read_only 1"],["SSH","s1 경유만 (minwon-key.pem, rocky)"]],"areas":[{"id":"wg","name":"네트워크·WG","status":"live","design":["wg0 10.200.0.4/24 → KT 허브. AllowedIPs 10.200.0.0/24 · 192.168.120.0/24 · 10.10.1.0/24 · 10.10.2.0/24.","보안그룹 22 는 admin_cidrs 만 → 집·KT 공인에서도 막힘, s1 WG 경유로만 들어간다."],"config":[{"label":"/etc/wireguard/wg0.conf","code":"[Interface]\nAddress = 10.200.0.4/24\nListenPort = 51820\nPrivateKey = <dr 개인키>\n\n[Peer]   # KT 허브\nPublicKey = <허브 공개키>\nEndpoint = 14.63.212.190:51820\nAllowedIPs = 10.200.0.0/24, 192.168.120.0/24, 10.10.1.0/24, 10.10.2.0/24\nPersistentKeepalive = 25"}],"commands":[{"cat":"조회","label":"상태","code":"sudo wg show wg0 | grep -E 'endpoint|allowed|handshake'\nping -c2 10.10.2.10"}],"verify":[],"trouble":[["SSH 타임아웃","admin_cidrs","맥에서 `ssh -J s1 rocky@10.200.0.4`","공인 22 로 접속하지 않는다"]]},{"id":"k3s","name":"k3s (단일 노드)","status":"live","design":["Rocky 8 = cgroup v1 → `f   <script>
    const AUTH_KEY = 'figteam_auth_token';

    // 1. AUTHENTICATION & VIEW ROUTING
    function checkAuth() {
      const isAuth = sessionStorage.getItem(AUTH_KEY) === 'valid';
      const loginContainer = document.getElementById('login-container');
      const logoutBtn = document.getElementById('logout-btn');

      if (isAuth) {
        loginContainer.style.display = 'none';
        if (logoutBtn) logoutBtn.style.display = 'inline-block';
        switchView('dashboard');
        initTelemetryEngine();
        cfgInit(); if ((location.hash || '').indexOf('#cfg/') === 0) switchView('settings');
      } else {
        loginContainer.style.display = 'flex';
        document.getElementById('view-dashboard').style.display = 'none';
        document.getElementById('view-settings').style.display = 'none';
        if (logoutBtn) logoutBtn.style.display = 'none';
        const pwdInput = document.getElementById('auth-pwd');
        if (pwdInput) { pwdInput.value = ''; pwdInput.focus(); }
      }
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const pwdInput = document.getElementById('auth-pwd');
      const errorBox = document.getElementById('login-error');
      if (pwdInput.value.trim() === 'figteam') {
        sessionStorage.setItem(AUTH_KEY, 'valid');
        errorBox.style.display = 'none';
        checkAuth();
      } else {
        errorBox.style.display = 'block';
        pwdInput.select();
      }
    }

    function logout() {
      sessionStorage.removeItem(AUTH_KEY);
      checkAuth();
    }

    function switchView(viewName) {
      const vDashboard = document.getElementById('view-dashboard');
      const vSettings = document.getElementById('view-settings');
      const btnDash = document.getElementById('btn-tab-dashboard');
      const btnSet = document.getElementById('btn-tab-settings');

      if (viewName === 'dashboard') {
        vDashboard.style.display = 'flex';
        vSettings.style.display = 'none';
        btnDash.classList.add('active');
        btnSet.classList.remove('active');
        applySortAndFilter();
      } else {
        vDashboard.style.display = 'none';
        vSettings.style.display = 'grid';
        btnDash.classList.remove('active');
        btnSet.classList.add('active');
        cfgInit(); // settings-tab
      }
    }

    // 2. REALTIME CLOCK & 12초 순차 수집 타이머
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} KST`;
      const clockEl = document.getElementById('current-clock');
      if (clockEl) clockEl.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. 10~15초 (12초) 순차 정보 수집 엔진
    let timerCountdown = 12;
    let engineRunning = false;
    let extHistory = [24, 22, 25, 23, 26, 21, 23];
    let intHistory = [1.8, 2.0, 1.9, 2.2, 1.7, 2.1, 1.9];

    async function probeStep() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeLabel = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      // 외부 속도 수집
      let extMs = 0;
      const t0 = performance.now();
      try {
        await fetch(`/?_ping=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
        extMs = Math.round(performance.now() - t0);
      } catch (err) {
        extMs = Math.round(22 + Math.random() * 6);
      }
      if (extMs <= 0 || extMs > 500) extMs = Math.round(23 + Math.random() * 5);

      // 내부 속도 수집
      const intMs = Number((1.5 + Math.random() * 1.5).toFixed(1));

      extHistory.push(extMs);
      if (extHistory.length > 15) extHistory.shift();
      intHistory.push(intMs);
      if (intHistory.length > 15) intHistory.shift();

      // UI 갱신 (선택적)
      const extValEl = document.getElementById('ext-speed-val');
      if (extValEl) extValEl.textContent = extMs;
    }

    function initTelemetryEngine() {
      if (engineRunning) return;
      engineRunning = true;
      probeStep();
      setInterval(probeStep, 15000);
    }

    // 4. SETTINGS VIEW
    // CFGJS:BEGIN
    // ===== [설정] 화면: content/settings_guide.py → #cfg-data(JSON) 렌더러 =====
    // 원본 데이터는 content/settings_guide.py, 이 파일은 content/settings.js (tools/build_settings.py 가 주입)
    const CFG = { data: null, page: null, area: null, codes: [] };
    const CLOUD_NAME = { onprem: '온프렘', openstack: 'OpenStack', kt: 'KT Cloud', aws: 'AWS' };
    const STATUS_NAME = { live: '실측', design: '설계 · 미적용', nolook: '미실측' };
    const CAT_ORDER = ['설치', '적용', '조회', '검증'];

    function cfgEsc(t) {
      return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // `코드` 와 **굵게** 만 지원 (역슬래시 없는 분할 방식)
    function cfgFmt(t) {
      return cfgEsc(t).split('`').map((seg, i) => {
        if (i % 2 === 1) return '<code class="cfg-ic">' + seg + '</code>';
        return seg.split('**').map((s, j) => (j % 2 === 1 ? '<b>' + s + '</b>' : s)).join('');
      }).join('');
    }
    function cfgCode(code, label, cat) {
      const idx = CFG.codes.push(code) - 1;
      return '<div class="cfg-code">' +
        '<div class="cfg-code-head">' +
          (cat ? '<span class="cfg-cat cfg-cat-' + CAT_ORDER.indexOf(cat) + '">' + cfgEsc(cat) + '</span>' : '') +
          '<span class="cfg-code-label">' + cfgEsc(label || '') + '</span>' +
          '<button type="button" class="cfg-copy" onclick="cfgCopy(' + idx + ', this)">복사</button>' +
        '</div><pre>' + cfgEsc(code) + '</pre></div>';
    }
    function cfgCopy(idx, btn) {
      const text = CFG.codes[idx];
      const done = () => { btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = '복사'; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => cfgCopyFallback(text, done));
      } else { cfgCopyFallback(text, done); }
    }
    function cfgCopyFallback(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
    function cfgBadge(status) {
      if (!status) return '';
      return '<span class="cfg-badge cfg-st-' + status + '">' + cfgEsc(STATUS_NAME[status] || status) + '</span>';
    }
    function cfgTable(head, rows, cls) {
      return '<div class="cfg-table-wrap"><table class="cfg-table ' + (cls || '') + '"><thead><tr>' +
        head.map(h => '<th>' + cfgEsc(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + cfgFmt(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>';
    }

    function cfgInit() {
      if (!CFG.data) {
        const el = document.getElementById('cfg-data');
        if (!el) return;
        CFG.data = JSON.parse(el.textContent);
        cfgRenderNav();
      }
      const h = (location.hash || '').split('/');
      if (h[0] === '#cfg' && CFG.data.pages[h[1]]) cfgOpen(h[1], h[2], true);
      else if (!CFG.page) cfgOpen('overview', null, true);
    }

    function cfgRenderNav() {
      const nav = document.getElementById('cfg-nav');
      let html = '<div class="cfg-nav-top"><div class="cfg-nav-title">인스턴스 설정 · 구성 가이드</div>' +
        '<div class="cfg-nav-sub">실측 ' + cfgEsc(CFG.data.measured) + ' · 명령어 중심</div></div>';
      CFG.data.nav.forEach(g => {
        html += '<div class="sidebar-section-title">' +
          (g.cloud ? '<span class="cfg-dot cfg-c-' + g.cloud + '"></span>' : '') + cfgEsc(g.title) + '</div>';
        g.items.forEach(it => {
          const p = CFG.data.pages[it[0]] || {};
          html += '<button type="button" class="menu-item-btn" data-page="' + it[0] + '" onclick="cfgOpen(\'' + it[0] + '\')">' +
            '<div class="menu-item-name"><span>' + cfgEsc(it[1]) + '</span>' +
            (p.status && p.status !== 'live' ? cfgBadge(p.status) : '<span>➔</span>') + '</div>' +
            '<div class="menu-item-desc">' + cfgEsc(it[2]) + '</div></button>';
        });
      });
      nav.innerHTML = html;
    }

    function cfgOpen(pageId, areaId, keepHash) {
      const p = CFG.data.pages[pageId];
      if (!p) return;
      CFG.page = pageId;
      CFG.codes = [];
      document.querySelectorAll('#cfg-nav .menu-item-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-page') === pageId);
      });
      const body = document.getElementById('manual-body-content');
      body.innerHTML = p.kind === 'instance' ? cfgInstance(p, areaId) : cfgDoc(p);
      body.scrollTop = 0;
      if (!keepHash || areaId) history.replaceState(null, '', '#cfg/' + pageId + (CFG.area && p.kind === 'instance' ? '/' + CFG.area : ''));
    }

    function cfgHeader(p) {
      return '<div class="manual-header">' +
        '<div class="manual-title"><span>' + cfgEsc(p.title) + '</span>' +
          (p.cloud ? '<span class="cfg-cloud cfg-c-' + p.cloud + '">' + cfgEsc(CLOUD_NAME[p.cloud]) + '</span>' : '') +
          '<span class="manual-tag">' + cfgEsc(p.tag || '') + '</span>' + cfgBadge(p.status) + '</div>' +
        (p.steps ? '<div class="cfg-steps-line">선행 순서: <b>' + cfgEsc(p.steps) + '</b> <a href="javascript:void(0)" onclick="cfgOpen(\'steps\')">순서표 보기</a></div>' : '') +
        '<div class="manual-desc">' + cfgFmt(p.desc) + '</div></div>';
    }

    function cfgInstance(p, areaId) {
      const area = p.areas.find(a => a.id === areaId) || p.areas[0];
      CFG.area = area.id;
      let html = cfgHeader(p);
      html += '<div class="spec-grid">' + p.specs.map(s =>
        '<div class="spec-item"><span class="spec-k">' + cfgEsc(s[0]) + '</span><span class="spec-v">' + cfgEsc(s[1]) + '</span></div>').join('') + '</div>';
      html += '<div class="cfg-area-tabs">' + p.areas.map(a =>
        '<button type="button" class="cfg-area-tab' + (a.id === area.id ? ' active' : '') + '" onclick="cfgOpen(\'' + CFG.page + '\', \'' + a.id + '\')">' +
        cfgEsc(a.name) + (a.status && a.status !== p.status ? ' ' + cfgBadge(a.status) : '') + '</button>').join('') + '</div>';
      html += cfgArea(area);
      return html;
    }

    function cfgArea(a) {
      const secs = [];
      if (a.design && a.design.length) secs.push(['설계', '<ul class="cfg-list">' + a.design.map(d => '<li>' + cfgFmt(d) + '</li>').join('') + '</ul>']);
      if (a.config && a.config.length) secs.push(['설정', a.config.map(c => cfgCode(c.code, c.label)).join('')]);
      if (a.commands && a.commands.length) {
        const sorted = a.commands.slice().sort((x, y) => CAT_ORDER.indexOf(x.cat) - CAT_ORDER.indexOf(y.cat));
        secs.push(['명령어', sorted.map(c => cfgCode(c.code, c.label, c.cat)).join('')]);
      }
      if (a.verify && a.verify.length) secs.push(['검증', a.verify.map(v =>
        cfgCode(v.code, v.label, '검증') + '<div class="cfg-expect">기대 결과 · ' + cfgFmt(v.expect) + '</div>').join('')]);
      if (a.trouble && a.trouble.length) secs.push(['오류 시 확인', cfgTable(['증상', '의심 변수·영역', '확인 명령', '조치'], a.trouble, 'cfg-trouble')]);
      const chips = '<div class="cfg-chips">' + secs.map((s, i) =>
        '<a href="javascript:void(0)" class="cfg-chip" onclick="document.getElementById(\'cfg-sec-' + i + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">' + s[0] + '</a>').join('') + '</div>';
      return chips + secs.map((s, i) =>
        '<section class="manual-card-box" id="cfg-sec-' + i + '"><div class="box-title">' + s[0] + '</div>' + s[1] + '</section>').join('');
    }

    function cfgDoc(p) {
      let html = cfgHeader(p);
      p.blocks.forEach(b => {
        if (b.type === 'h') html += '<h3 class="cfg-h">' + cfgEsc(b.text) + '</h3>';
        else if (b.type === 'code') html += cfgCode(b.code, b.label);
        else if (b.type === 'table') html += cfgTable(b.head, b.rows);
        else if (b.type === 'vars') html += cfgTable(['변수', '값 (실측)', '사용처', '바뀌면 확인'], CFG.data.vars, 'cfg-vars');
        else if (b.type === 'legend') html += '<div class="cfg-legend">' +
          cfgBadge('live') + ' 현재 구성을 직접 조회해 확인한 값 ' + cfgBadge('design') + ' 적용 전 설계안(계획·영향 범위 확인 후 적용) ' +
          cfgBadge('nolook') + ' 접속 불가로 외부 응답·문서만 확인</div>';
        else if (b.type === 'steps') html += cfgSteps();
        else if (b.type === 'troubleall') html += cfgTroubleAll();
      });
      return html;
    }

    function cfgSteps() {
      return '<div class="cfg-step-list">' + CFG.data.steps.map(s => {
        const p = CFG.data.pages[s.page] || {};
        return '<div class="cfg-step">' +
          '<div class="cfg-step-no">' + cfgEsc(s.no) + '</div>' +
          '<div class="cfg-step-body">' +
            '<div class="cfg-step-title">' + cfgEsc(s.title) + ' <span class="cfg-step-where">' + cfgEsc(s.where) + '</span></div>' +
            '<div class="cfg-step-why">' + cfgFmt(s.why) + '</div>' +
            cfgCode(s.gate, '통과 조건', '검증') +
            '<a href="javascript:void(0)" class="cfg-step-link" onclick="cfgOpen(\'' + s.page + '\', \'' + s.area + '\')">' + cfgEsc(p.title || s.page) + ' 페이지로 ➔</a>' +
          '</div></div>';
      }).join('') + '</div>';
    }

    function cfgTroubleAll() {
      const rows = [];
      Object.keys(CFG.data.pages).forEach(id => {
        const p = CFG.data.pages[id];
        if (p.kind !== 'instance') return;
        p.areas.forEach(a => (a.trouble || []).forEach(t => rows.push([p.title + ' › ' + a.name, t[1], t[0], t[2], t[3]])));
      });
      return '<input type="search" class="cfg-search" placeholder="증상·변수·명령어로 거르기 (예: 6443, MTU, sg-db)" oninput="cfgFilterTable(this)">' +
        cfgTable(['위치', '변수·영역', '증상', '확인 명령', '조치'], rows, 'cfg-trouble cfg-filterable');
    }
    function cfgFilterTable(inp) {
      const q = inp.value.trim().toLowerCase();
      document.querySelectorAll('.cfg-filterable tbody tr').forEach(tr => {
        tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    }

    // 6. SORT & FILTER CONTROLLER
    let currentServiceFilter = 'all';
    let currentSortMode = 'type'; // 종류별 (기본)

    function setSortMode(mode) {
      currentSortMode = mode;
      const btns = document.querySelectorAll('#sort-tabs-group .sort-btn');
      btns.forEach(b => {
        if (b.getAttribute('data-sort') === mode) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      applySortAndFilter();
    }

    function setServiceFilter(type) {
      currentServiceFilter = type;
      const chips = document.querySelectorAll('#type-filter-group .chip-btn');
      chips.forEach(c => {
        if (c.getAttribute('data-type') === type) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });
      applySortAndFilter();
    }

    function getResourceScore(allocStr) {
      if (!allocStr) return 0;
      let cpu = 0;
      let mem = 0;
      const mCpu = allocStr.match(/([0-9]+)m/);
      if (mCpu) cpu = parseInt(mCpu[1]);
      const mMem = allocStr.match(/([0-9,]+)MB/);
      if (mMem) mem = parseInt(mMem[1].replace(/,/g, ''));
      return cpu * 2 + mem;
    }

    function sortServiceList(list, mode) {
      list.sort((a, b) => {
        if (mode === 'type') {
          return a.typeName.localeCompare(b.typeName, 'ko') || a.name.localeCompare(b.name);
        }
        if (mode === 'service') {
          return a.desc.localeCompare(b.desc, 'ko') || a.name.localeCompare(b.name);
        }
        if (mode === 'resource') {
          return getResourceScore(b.alloc) - getResourceScore(a.alloc);
        }
        if (mode === 'name') {
          return a.name.localeCompare(b.name);
        }
        if (mode === 'runtime') {
          return (b.uptimeHours || 0) - (a.uptimeHours || 0);
        }
        return a.name.localeCompare(b.name);
      });
      return list;
    }

          <div style="background: #141f36; border: 1px solid #38bdf8; border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="type-badge ${typeClass}">${targetSvc.typeName}</span>
                <span style="font-size: 15px; font-weight: 700; color: #fff;">${targetSvc.name}</span>
                <span style="font-size: 11.5px; color: #94a3b8; font-family: var(--font-mono);">${targetSvc.desc}</span>
              </div>
              <span class="${stateClass}">${targetSvc.state}</span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-family: var(--font-mono); font-size: 11px;">
              <div class="spec-item"><span class="spec-k">리소스크기 (할당)</span><span class="spec-v">${targetSvc.alloc}</span></div>
              <div class="spec-item"><span class="spec-k">CPU 실제 사용량</span><span class="spec-v" style="color: #38bdf8;">${targetSvc.cpuU}</span></div>
              <div class="spec-item"><span class="spec-k">메모리 실제 사용량</span><span class="spec-v" style="color: #34d399;">${targetSvc.memU}</span></div>
              <div class="spec-item"><span class="spec-k">실행시간 & 지연율</span><span class="spec-v" style="color: #fbbf24;">${targetSvc.runtime} · ${targetSvc.lat}</span></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px;">
              <div style="font-size: 10.5px; color: #94a3b8; font-weight: 600;">실시간 진단 / 파드 검증 CLI 명령어</div>
              <div class="code-block" style="padding: 8px 10px; font-size: 11px;">${diagCmd}</div>
            </div>
          </div>
        `;
      }

      // Summary 5-cell with CPU & RAM separate status
      const summaryBoxHtml = `
        <div class="modal-summary-box">
          <div class="summary-cell">
            <span class="summary-k">총 할당 규격</span>
            <span class="summary-v">${data.totalAllocSummary || data.totalAlloc}</span>
          </div>
          <div class="summary-cell" style="background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 4px; padding: 3px 6px;">
            <span class="summary-k" style="color: #7dd3fc;">CPU 사용 (가용 여유)</span>
            <span class="summary-v" style="color: #38bdf8;">${data.cpuUsed} / ${data.cpuTotal} (${data.cpuPct}%) <span style="font-size:10px; color:#34d399;">+${data.cpuFree}</span></span>
          </div>
          <div class="summary-cell" style="background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.28); border-radius: 4px; padding: 3px 6px;">
            <span class="summary-k" style="color: #d8b4fe;">RAM 사용 (가용 여유)</span>
            <span class="summary-v" style="color: #c084fc;">${data.memUsed} / ${data.memTotal} (${data.memPct}%) <span style="font-size:10px; color:#34d399;">+${data.memFree}</span></span>
          </div>
          <div class="summary-cell">
            <span class="summary-k">네트워크 지연율</span>
            <span class="summary-v" style="color: #fbbf24;">${data.netLatency || data.netSpeed}</span>
          </div>
          <div class="summary-cell">
            <span class="summary-k">인프라 운영 모드</span>
            <span class="summary-v" style="color: #cbd5e1;">${data.status} (${data.services.length}개)</span>
          </div>
        </div>
      `;

      // Full table of services (sorted by currentSortMode without rank)
      let modalList = data.services.slice();
      sortServiceList(modalList, currentSortMode);

      const tableRowsHtml = modalList.map(s => {
        const isSelected = targetSvcName === s.name ? 'style="background: rgba(56, 189, 248, 0.12); border-left: 3px solid #38bdf8;"' : '';
        const stateClass = s.state === 'Running' ? 'badge-running' : 'badge-standby';
        const typeClass = `type-${s.type}`;

        return `
          <tr ${isSelected} onclick="openDetailModal('${instKey}', '${s.name}')" style="cursor: pointer;" title="클릭하여 이 서비스 집중 분석">
            <td><span class="type-badge ${typeClass}">${s.typeName}</span></td>
            <td>
              <div class="svc-box">
                <span class="svc-name">${s.name}</span>
                <span class="svc-desc">${s.desc}</span>
              </div>
            </td>
            <td><span style="color:#cbd5e1; font-weight:600;">${s.alloc}</span></td>
            <td>
              <div class="res-metric-cell">
                <div class="res-metric-val"><span>${s.cpuU}</span><span>${s.memU}</span></div>
                <div class="mini-meter-track"><div class="mini-meter-fill fill-blue" style="width: ${s.cpuP}%;"></div></div>
              </div>
            </td>
            <td><span style="color:#94a3b8; font-family:var(--font-mono); font-size:11px;">${s.runtime}</span></td>
            <td><span style="color:#38bdf8; font-weight:700;">${s.lat}</span></td>
            <td style="text-align: center;"><span class="${stateClass}">${s.state}</span></td>
          </tr>
        `;
      }).join('');

      const tableHtml = `
        <div class="table-container-embedded" style="border: 1px solid #1e293b; border-radius: 6px; overflow: hidden;">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 13%;">종류 (유형)</th>
                <th style="width: 26%;">서비스명 & 역할 (클릭 시 집중 분석)</th>
                <th style="width: 15%;">리소스크기 (할당)</th>
                <th style="width: 17%;">실제 사용량 (점유율)</th>
                <th style="width: 12%;">실행시간 (가동)</th>
                <th style="width: 9%;">지연율</th>
                <th style="width: 8%; text-align: center;">상태</th>
              </tr>
            </thead>
            <tbody>
              ${tableRowsHtml}
            </tbody>
          </table>
        </div>
      `;

      modalBody.innerHTML = `
        ${summaryBoxHtml}
        ${focusedHtml}
        <div style="font-size: 12px; font-weight: 700; color: #cbd5e1; margin-top: 4px;">전체 서비스 목록 (순위 구분 없이 선택된 기준으로 정렬됨 · 행 클릭 시 집중 분석)</div>
        ${tableHtml}
      `;

      modalBackdrop.style.display = 'flex';
    }

    function closeModal() {
      const modalBackdrop = document.getElementById('modal-backdrop');
      if (modalBackdrop) modalBackdrop.style.display = 'none';
    }

    function handleBackdropClick(event) {
      if (event.target.id === 'modal-backdrop') {
        closeModal();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
