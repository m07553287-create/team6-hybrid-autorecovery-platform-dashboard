name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 정적 산출물 빌드 및 검증
        run: |
          tools/build.sh
          git diff --stat --exit-code -- public backend/server.py || { echo "::error::tools/build.sh 를 실행한 결과를 커밋하세요."; exit 1; }

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 공식 배포
        id: deployment
        uses: actions/deploy-pages@v4
