# /etc/redis/figteam.conf — 위키 전용 Redis (redis.conf 끝에서 include)
# 이 서버에만 있는 독립 인스턴스: 밖에서 접속 불가(localhost), db-01(MySQL)과 무관
bind 127.0.0.1 ::1
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
save 900 1 300 10
maxmemory 200mb
maxmemory-policy noeviction
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
# requirepass 는 install.sh 가 /etc/redis/figteam-pass.conf 에 따로 만든다(저장소에 없음)
include /etc/redis/figteam-pass.conf
