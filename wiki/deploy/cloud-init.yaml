#cloud-config
# wiki-01 최초 부팅 (openstack server create --config-drive true --user-data cloud-init.yaml)
# ext-net 은 DHCP 가 꺼져 있어 고정 IP 는 config drive 의 network_data 로 들어온다.
package_update: true
packages: [python3-venv, redis-server, rsync]
users:
  - default
  - name: wiki
    system: true
    shell: /usr/sbin/nologin
    homedir: /var/lib/figteam-wiki
runcmd:
  - install -d -o wiki -g wiki -m 750 /var/lib/figteam-wiki
  - install -d -o root -g wiki -m 750 /etc/figteam-wiki
  - install -d -o root -g root -m 755 /opt/figteam-wiki
  - install -d -o root -g root -m 700 /var/backups/figteam-wiki
  - timedatectl set-timezone Asia/Seoul
